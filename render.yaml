databases:
  - name: resumeiq-db
    plan: free
    databaseName: resumeiq
    user: resumeiq

services:
  - type: web
    name: resumeiq-backend
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: PYTHONPATH
        value: .
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: resumeiq-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: AI_PROVIDER
        value: auto
      - key: OPENAI_BASE_URL
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: local
      - key: AI_FALLBACK_ENABLED
        value: "false"
      - key: CORS_ORIGIN_REGEX
        value: ^https://.*\.onrender\.com$

  - type: web
    name: resumeiq-app
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start -- -p $PORT -H 0.0.0.0
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: BACKEND_INTERNAL_URL
        value: https://resumeiq-backend-so9j.onrender.com
